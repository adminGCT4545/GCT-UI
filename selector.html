<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GCT UI - Choose Version</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0f0f;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        
        h1 {
            font-size: 24px;
            margin-bottom: 30px;
        }
        
        .versions {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .version-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 30px;
            width: 250px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.2s, background-color 0.2s;
            cursor: pointer;
        }
        
        .version-card:hover {
            background-color: #2a2a2a;
            transform: translateY(-5px);
        }
        
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        
        h2 {
            font-size: 18px;
            margin-bottom: 10px;
        }
        
        p {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
        }
        
        .btn {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
        }
        
        .btn:hover {
            background-color: #0066cc;
        }
    </style>
</head>
<body>
    <h1>GCT UI - Choose Version</h1>
    
    <div class="versions">
        <div class="version-card" onclick="window.location.href='index.html'">
            <div class="icon">🖥️</div>
            <h2>Desktop Version</h2>
            <p>Traditional desktop interface with sidebar navigation.</p>
            <a href="index.html" class="btn">Open Desktop Version</a>
        </div>
        
        <div class="version-card" onclick="window.location.href='mobile.html'" style="background-color: #1a3a5a;">
            <div class="icon">📱</div>
            <h2>Mobile Version</h2>
            <p>Mobile-optimized React-style interface with platform toggles.</p>
            <a href="mobile.html" class="btn" style="background-color: #0095ff;">Open Mobile Version</a>
            <span style="position: absolute; top: 10px; right: 10px; background-color: #0095ff; color: white; padding: 3px 8px; border-radius: 10px; font-size: 12px;">FIXED</span>
        </div>
        
        <div class="version-card" onclick="window.location.href='icon-test.html'">
            <div class="icon">🔍</div>
            <h2>Icon Test</h2>
            <p>Test page for Lucide icon rendering.</p>
            <a href="icon-test.html" class="btn">Open Icon Test</a>
        </div>
    </div>
</body>
</html>
